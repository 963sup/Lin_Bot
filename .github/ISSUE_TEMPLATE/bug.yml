name: Bug report
description: Report a reproducible problem without including secrets or personal data.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem using redacted examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

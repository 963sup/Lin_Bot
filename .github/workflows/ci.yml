name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit and integration tests
        run: pnpm run test
      - name: Domain boundary guard
        run: pnpm run architecture:check
      - name: Nested AGENTS coverage
        run: pnpm run agents:check
      - name: Validate Codex TOML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          agents = list(Path(".codex/agents").glob("*.toml"))
          assert agents, "At least one custom Codex agent is required."
          for path in agents:
              data = tomllib.loads(path.read_text(encoding="utf-8"))
              for key in ("name", "description", "developer_instructions"):
                  assert isinstance(data.get(key), str) and data[key].strip(), f"{path}: missing {key}"
          print(f"Validated {len(agents)} Codex TOML agents")
          PY
      - name: Build
        run: pnpm run build
      - name: Check environment defaults
        run: pnpm run env:check
